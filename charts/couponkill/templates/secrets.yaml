{{- /*
仅本地 / 开发使用（secrets.create=true）：生成 couponkill-app-secrets。
  * 未指定的取值用 randAlphaNum 随机生成；
  * 升级时先 lookup 已有 Secret，已有的键原样保留——否则每次 helm upgrade 都会换掉
    JWT 密钥（所有会话失效）和数据库口令（与已初始化的 PostgreSQL 数据卷对不上）。
  * helm template / --dry-run 看不到集群，lookup 为空，输出里的随机值只是示意。
生产请 secrets.create=false 并自行创建同名 Secret（README 有命令）。
*/ -}}
{{- if .Values.secrets.create }}
{{- $name := include "couponkill.appSecretName" . }}
{{- $ns := include "couponkill.ns" . }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- $existingData := dict }}
{{- if $existing }}{{ $existingData = ($existing.data | default dict) }}{{ end }}
{{- $specs := list
  (list "jwtSecret" 48)
  (list "internalToken" 32)
  (list "gatewaySignKey" 48)
  (list "postgresPassword" 24) }}
{{- if .Values.redis.auth.enabled }}{{ $specs = append $specs (list "redisPassword" 24) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: couponkill
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: couponkill
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  {{- range $spec := $specs }}
  {{- $k := include "couponkill.secretKey" (list $ (index $spec 0)) }}
  {{- $provided := index ($.Values.secrets.values | default dict) (index $spec 0) | default "" }}
  {{- if hasKey $existingData $k }}
  {{ $k }}: {{ index $existingData $k | quote }}
  {{- else if $provided }}
  {{ $k }}: {{ $provided | toString | b64enc | quote }}
  {{- else }}
  {{ $k }}: {{ randAlphaNum (int (index $spec 1)) | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := ($.Values.secrets.values.connector | default dict) }}
  {{- if $v }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
