{{- if .Values.secrets.create }}
{{- $name := include "couponkill.appSecretName" . }}
{{- $ns := .Values.namespace }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- $pgKey := include "couponkill.secretKey.postgresPassword" . }}
{{- $jwtKey := include "couponkill.secretKey.jwtSecret" . }}
{{- $tokKey := include "couponkill.secretKey.connectorInternalToken" . }}
{{- $nacosKey := include "couponkill.secretKey.nacosAuthToken" . }}
{{- $pg := .Values.secrets.postgresPassword | default .Values.db.password | default "" }}
{{- if not $pg }}
{{- fail "secrets.create=true 时必须提供 secrets.postgresPassword 或 db.password。生产请改 secrets.create=false 并预先创建 existingSecret。" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: couponkill
    app.kubernetes.io/component: secrets
type: Opaque
data:
  {{ $pgKey }}: {{ $pg | toString | b64enc | quote }}
  {{- if and $existing (index $existing.data $jwtKey) }}
  {{ $jwtKey }}: {{ index $existing.data $jwtKey | quote }}
  {{- else if .Values.secrets.jwtSecret }}
  {{ $jwtKey }}: {{ .Values.secrets.jwtSecret | toString | b64enc | quote }}
  {{- else }}
  {{ $jwtKey }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (index $existing.data $tokKey) }}
  {{ $tokKey }}: {{ index $existing.data $tokKey | quote }}
  {{- else if .Values.secrets.connectorInternalToken }}
  {{ $tokKey }}: {{ .Values.secrets.connectorInternalToken | toString | b64enc | quote }}
  {{- else }}
  {{ $tokKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (index $existing.data $nacosKey) }}
  {{ $nacosKey }}: {{ index $existing.data $nacosKey | quote }}
  {{- else if .Values.secrets.nacosAuthToken }}
  {{ $nacosKey }}: {{ .Values.secrets.nacosAuthToken | toString | b64enc | quote }}
  {{- else }}
  {{ $nacosKey }}: {{ randAlphaNum 32 | b64enc | b64enc | quote }}
  {{- end }}
{{- end }}
